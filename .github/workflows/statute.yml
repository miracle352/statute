# Statute checks its own demo shop on pull requests. check: auto reads the diff and runs only
# the checks the change could affect; a change to docs or styling runs nothing and costs no credits.
# The shop ships with deliberate bugs, so a run that does happen is expected to report violations (fail-on: never).
name: Statute on the demo shop
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  consent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          check: auto
          url: http://localhost:4173
          start: node demo-store/server.js
          lt-username: ${{ secrets.LT_USERNAME }}
          lt-access-key: ${{ secrets.LT_ACCESS_KEY }}
          fail-on: never
