# Statute checks its own demo shop on every pull request: the shop ships with
# deliberate bugs, so this job is expected to report violations (fail-on: never).
name: Statute on the demo shop
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  consent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          check: consent
          url: http://localhost:4173
          start: node demo-store/server.js
          lt-username: ${{ secrets.LT_USERNAME }}
          lt-access-key: ${{ secrets.LT_ACCESS_KEY }}
          fail-on: never
