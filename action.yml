name: Statute
description: Kane CLI checks a site against consumer law in a real browser; code judges the evidence. Fails on a violation.
author: miracle352
branding:
  icon: check-circle
  color: green

inputs:
  url:
    description: Address Kane should visit (a PR preview URL, your production site, or a local URL used with `start`).
    required: true
  check:
    description: >
      Which checks to run: consent, price, cancel, several separated by spaces, or auto.
      auto reads the pull request diff and runs only the checks the change could affect
      (needs actions/checkout with fetch-depth 0). A change that touches none of them runs nothing and costs no Kane credits.
    default: consent
  start:
    description: Optional command that starts your app on the runner before Kane visits (for example `npm start`).
    default: ""
  lt-username:
    description: TestMu AI username, for Kane CLI. Pass it from a repository secret.
    required: true
  lt-access-key:
    description: TestMu AI access key, for Kane CLI. Pass it from a repository secret.
    required: true
  fail-on:
    description: "violation (default) fails the job on a violation; never only reports."
    default: violation
  comment:
    description: "Post the verdict as a comment on the pull request (needs pull-requests: write)."
    default: "true"
  fix:
    description: >
      On a pull request with a violation, hand Statute's report to Claude Code, let it fix the app,
      and send Kane back. The fix is committed to the pull request only if Kane passes.
      Needs `start` (the app must run on the runner), `claude-token`, contents: write,
      and actions/checkout set to the pull request branch (ref: github.head_ref). Pull requests from forks are only checked.
    default: "false"
  claude-token:
    description: Claude Code token for `fix` (run `claude setup-token`). Pass it from a repository secret.
    default: ""
  app:
    description: Folder Claude Code may edit when fixing. Defaults to the whole repository.
    default: "."
  rounds:
    description: Most fix attempts before giving up.
    default: "3"
  screenshots:
    description: >
      Show Kane's screenshots in the pull request comment or watch issue. They are stored on a
      `statute-shots` branch of this repository (needs contents: write and actions/checkout).
    default: "true"
  issue:
    description: >
      Outside pull requests (a schedule, a manual run), open an issue when a check fails and close it
      once the checks pass again (needs issues: write). Use it to watch your live site.
    default: "false"
  github-token:
    description: Token used to comment and to open or close issues.
    default: ${{ github.token }}

outputs:
  verdict:
    description: pass, violation, inconclusive or skipped
    value: ${{ steps.run.outputs.verdict }}
  checks:
    description: The checks that ran, separated by spaces
    value: ${{ steps.plan.outputs.checks }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Pick the checks
      id: plan
      shell: bash
      env:
        STATUTE_CHECK: ${{ inputs.check }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        checks="${STATUTE_CHECK//,/ }"
        # A commit Statute pushed itself was already proven by Kane in the run that made it.
        if [ -n "$HEAD_SHA" ] && [ "$(git log -1 --format=%ae "$HEAD_SHA" 2>/dev/null)" = "statute-bot@users.noreply.github.com" ]; then
          echo "The latest commit is Statute's own fix, already proven by Kane. Nothing to run."
          echo "self=true" >> "$GITHUB_OUTPUT"
          echo "checks=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$checks" = "auto" ]; then
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            git diff "$BASE_SHA"...HEAD > "$RUNNER_TEMP/statute.diff"
            node "$GITHUB_ACTION_PATH/bin/scope.js" --json < "$RUNNER_TEMP/statute.diff" > "$RUNNER_TEMP/statute-scope.json"
            checks=$(node -e 'console.log(require(process.argv[1]).checks.join(" "))' "$RUNNER_TEMP/statute-scope.json")
          else
            echo "::warning title=Statute::check is auto but the pull request diff is not available (use actions/checkout with fetch-depth: 0). Running every check."
            checks="consent price cancel"
          fi
        fi
        echo "checks=$checks" >> "$GITHUB_OUTPUT"
        echo "Checks to run: ${checks:-none}"

    - name: Install Kane CLI
      if: steps.plan.outputs.checks != ''
      shell: bash
      run: npm install -g @testmuai/kane-cli

    - name: Install Claude Code
      if: steps.plan.outputs.checks != '' && inputs.fix == 'true' && github.event_name == 'pull_request' && inputs.claude-token != '' && inputs.start != ''
      shell: bash
      run: npm install -g @anthropic-ai/claude-code && echo "STATUTE_FIX=1" >> "$GITHUB_ENV"

    - name: Run the checks
      id: run
      if: steps.plan.outputs.self != 'true'
      shell: bash
      env:
        LT_USERNAME: ${{ inputs.lt-username }}
        LT_ACCESS_KEY: ${{ inputs.lt-access-key }}
        STATUTE_CHECKS: ${{ steps.plan.outputs.checks }}
        STATUTE_URL: ${{ inputs.url }}
        STATUTE_START: ${{ inputs.start }}
        STATUTE_APP: ${{ inputs.app }}
        STATUTE_ROUNDS: ${{ inputs.rounds }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-token }}
      run: |
        set +e
        out="$RUNNER_TEMP/statute-report"; mkdir -p "$out"
        summary="$out/summary.md"; : > "$summary"
        if [ -z "$STATUTE_CHECKS" ]; then
          echo "verdict=skipped" >> "$GITHUB_OUTPUT"
          {
            echo "## Statute: nothing to check"
            echo
            echo "Nothing in this change touches tracking, prices or subscriptions, so Kane was not run. 0 credits used."
          } > "$summary"
          if [ -f "$RUNNER_TEMP/statute-scope.json" ]; then
            echo >> "$summary"
            node -e 'const r=require(process.argv[1]);const l=r.changed.slice(0,8).map(f=>"`"+f+"`").join(", ");console.log("Changed: "+(l||"no files")+(r.changed.length>8?", and "+(r.changed.length-8)+" more":"")+".")' "$RUNNER_TEMP/statute-scope.json" >> "$summary"
          fi
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        worst=pass
        fixed=""
        for c in $STATUTE_CHECKS; do
          dir="$out"
          if [ "$STATUTE_FIX" = 1 ]; then
            dir="$out/$c"; mkdir -p "$dir"
            args=(fix "$c" --url "$STATUTE_URL" --start "$STATUTE_START" --app "$STATUTE_APP" --rounds "$STATUTE_ROUNDS" --out "$dir")
          else
            args=(check "$c" --url "$STATUTE_URL" --out "$out")
            if [ -n "$STATUTE_START" ]; then args+=(--start "$STATUTE_START"); fi
          fi
          node "$GITHUB_ACTION_PATH/bin/statute.js" "${args[@]}" 2>&1 | tee -a "$RUNNER_TEMP/statute.log"
          code=${PIPESTATUS[0]}
          case $code in 0) v=pass ;; 1) v=violation ;; *) v=inconclusive ;; esac
          if [ "$STATUTE_FIX" = 1 ] && grep -q "Claude Code fixed" "$dir/loop.md" 2>/dev/null && [ "$code" = 0 ]; then fixed="$fixed $c"; fi
          if [ "$v" = violation ]; then worst=violation; elif [ "$v" = inconclusive ] && [ "$worst" = pass ]; then worst=inconclusive; fi
          if [ "$STATUTE_FIX" = 1 ] && [ -f "$dir/loop.md" ]; then
            sed '1s/^\xEF\xBB\xBF//' "$dir/loop.md" >> "$summary"
          elif [ -f "$dir/$c.md" ]; then sed '1s/^\xEF\xBB\xBF//' "$dir/$c.md" >> "$summary"
          else echo "Statute could not finish the **$c** check. See the job log." >> "$summary"; fi
          if [ -f "$RUNNER_TEMP/statute-scope.json" ]; then
            why=$(node -e 'const r=require(process.argv[1]).reasons[process.argv[2]]||[];console.log(r.slice(0,3).map(x=>"`"+x.file+"` ("+x.why+": `"+x.line.replace(/`/g,"").slice(0,60)+"`)").join(", "))' "$RUNNER_TEMP/statute-scope.json" "$c")
            [ -n "$why" ] && printf '\n_Statute ran this check because the change touches %s._\n' "$why" >> "$summary"
          fi
          printf '\n\n' >> "$summary"
        done
        echo "verdict=$worst" >> "$GITHUB_OUTPUT"
        echo "fixed=${fixed# }" >> "$GITHUB_OUTPUT"
        cat "$summary" >> "$GITHUB_STEP_SUMMARY"

    - name: Push the fix Kane proved
      id: push
      if: steps.run.outputs.fixed != ''
      shell: bash
      env:
        FIXED: ${{ steps.run.outputs.fixed }}
        STATUTE_APP: ${{ inputs.app }}
      run: |
        git config user.name "statute[bot]"
        git config user.email "statute-bot@users.noreply.github.com"
        git add -A -- "$STATUTE_APP" ':(exclude,glob)**/node_modules/**' ':(exclude,glob)**/statute-report/**'
        if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
        git commit -m "Fix $FIXED: Statute found the violation, Claude Code fixed it, Kane proved the fix"
        git push origin "HEAD:${GITHUB_HEAD_REF}"
        echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Publish Kane's screenshots
      id: shots
      if: always() && inputs.screenshots == 'true' && steps.plan.outputs.checks != ''
      continue-on-error: true
      shell: bash
      env:
        REPO: ${{ github.repository }}
        SERVER: ${{ github.server_url }}
      run: |
        set -e
        git rev-parse --git-dir >/dev/null 2>&1 || { echo "No checkout, so no screenshots."; exit 0; }
        shots="$RUNNER_TEMP/statute-shots"
        node "$GITHUB_ACTION_PATH/bin/shots.js" "$RUNNER_TEMP/statute-report" "$shots"
        n=$(node -e 'console.log(require(process.argv[1]).length)' "$shots/shots.json")
        [ "$n" -gt 0 ] || exit 0
        dest="runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        wt="$RUNNER_TEMP/statute-shots-wt"
        git worktree add --detach "$wt" >/dev/null 2>&1
        cd "$wt"
        git config user.name "statute[bot]"
        git config user.email "statute-bot@users.noreply.github.com"
        if git fetch -q --depth 1 origin statute-shots 2>/dev/null; then git checkout -q -B statute-shots FETCH_HEAD
        else git checkout -q --orphan statute-shots && git rm -rfq . >/dev/null 2>&1 || true; fi
        mkdir -p "$dest" && cp "$shots"/* "$dest/"
        git add "$dest" && git commit -qm "Kane screenshots for run $GITHUB_RUN_ID"
        for i in 1 2 3; do
          git push -q origin statute-shots && break
          git fetch -q --depth 1 origin statute-shots && git rebase -q FETCH_HEAD
        done
        node -e '
          const list = require(process.argv[1]);
          const base = `${process.argv[2]}/${process.argv[3]}/blob/statute-shots/${process.argv[4]}/`;
          const cells = list.slice(0, 4).map((s) => `<td valign="top" width="50%"><img src="${base}${s.file}?raw=true" alt="${s.caption.replace(/"/g, "")}"><br><sub>${s.pack}, step ${s.step}: ${s.caption}</sub></td>`);
          const rows = [];
          for (let i = 0; i < cells.length; i += 2) rows.push("<tr>" + cells.slice(i, i + 2).join("") + "</tr>");
          console.log("#### What Kane saw\n\n<table>" + rows.join("") + "</table>\n");
        ' "$shots/shots.json" "$SERVER" "$REPO" "$dest" > "$RUNNER_TEMP/statute-report/shots.md"
        echo "md=$RUNNER_TEMP/statute-report/shots.md" >> "$GITHUB_OUTPUT"

    - name: Keep the case file
      if: always() && steps.plan.outputs.checks != ''
      uses: actions/upload-artifact@v4
      with:
        name: statute-case-file
        path: ${{ runner.temp }}/statute-report
        if-no-files-found: ignore

    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request' && steps.plan.outputs.self != 'true'
      uses: actions/github-script@v7
      env:
        SUMMARY: ${{ runner.temp }}/statute-report/summary.md
        HAS_RUN: ${{ steps.plan.outputs.checks != '' }}
        PUSHED: ${{ steps.push.outputs.sha }}
        SHOTS: ${{ steps.shots.outputs.md }}
        FIXED: ${{ steps.run.outputs.fixed }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          let body = "";
          try { body = fs.readFileSync(process.env.SUMMARY, "utf8"); } catch { body = "Statute could not finish. See the job log."; }
          const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          if (process.env.PUSHED) body += `**Fixed and proven.** Claude Code fixed ${process.env.FIXED}, Kane checked the page again and it passed, so Statute pushed the fix to this pull request as ${process.env.PUSHED}.\n\n`;
          try { if (process.env.SHOTS) body += fs.readFileSync(process.env.SHOTS, "utf8") + "\n"; } catch {}
          if (process.env.HAS_RUN === "true") body += `---\nCase file with Kane's screenshots: download **statute-case-file** from [this run](${run}).`;
          const marker = "<!-- statute:check -->";
          const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
          const mine = comments.find((c) => c.body && c.body.includes(marker));
          if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body: marker + "\n" + body });
          else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: marker + "\n" + body });

    - name: Open or close the watch issue
      if: always() && inputs.issue == 'true' && github.event_name != 'pull_request' && steps.plan.outputs.checks != ''
      uses: actions/github-script@v7
      env:
        SUMMARY: ${{ runner.temp }}/statute-report/summary.md
        VERDICT: ${{ steps.run.outputs.verdict }}
        URL: ${{ inputs.url }}
        SHOTS: ${{ steps.shots.outputs.md }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          const label = "statute";
          const url = process.env.URL, verdict = process.env.VERDICT;
          const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          let report = "";
          try { report = fs.readFileSync(process.env.SUMMARY, "utf8"); } catch {}
          try { if (process.env.SHOTS) report += "\n" + fs.readFileSync(process.env.SHOTS, "utf8"); } catch {}
          const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: label, per_page: 50 });
          const mine = open.find((i) => i.title.includes(url));
          if (verdict === "violation") {
            const body = `Statute's scheduled check of ${url} found a violation on the live site.\n\n${report}---\nCase file with Kane's screenshots: download **statute-case-file** from [this run](${run}).\n\nThis issue closes itself once the check passes again.`;
            if (mine) await github.rest.issues.createComment({ ...context.repo, issue_number: mine.number, body: `Still failing. [Run](${run}).\n\n${report}` });
            else {
              try { await github.rest.issues.createLabel({ ...context.repo, name: label, color: "b60205", description: "Opened by Statute" }); } catch {}
              await github.rest.issues.create({ ...context.repo, title: `Statute: live site violation on ${url}`, body, labels: [label] });
            }
          } else if (verdict === "pass" && mine) {
            await github.rest.issues.createComment({ ...context.repo, issue_number: mine.number, body: `Kane checked ${url} again and it passes now. Closing. [Run](${run}).` });
            await github.rest.issues.update({ ...context.repo, issue_number: mine.number, state: "closed", state_reason: "completed" });
          }

    - name: Fail on a violation
      if: inputs.fail-on == 'violation' && steps.run.outputs.verdict == 'violation'
      shell: bash
      run: |
        echo "::error title=Statute::Kane found a violation. See the job summary and the statute-case-file artifact."
        exit 1
